[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    HTTP_Server  On
    HTTP_Listen  127.0.0.1
    HTTP_Port    2020
    storage.path ${AUTOK_LOGAL_STORAGE_PATH}
    storage.sync normal
    storage.checksum off
    storage.backlog.mem_limit 16M

[INPUT]
    Name         opentelemetry
    Listen       127.0.0.1
    Port         ${AUTOK_LOGAL_OTLP_INTERNAL_PORT}
    Tag          otel
    storage.type filesystem

[INPUT]
    Name         http
    Listen       127.0.0.1
    Port         3847
    Tag          frontend
    storage.type filesystem

[INPUT]
    Name         http
    Listen       127.0.0.1
    Port         3848
    Tag          admin
    storage.type filesystem

[OUTPUT]
    Name            autok_sqlite
    Match           *
    db_path         ${AUTOK_LOGAL_DB_PATH}
    retention_hours ${AUTOK_LOGAL_RETENTION_HOURS}
